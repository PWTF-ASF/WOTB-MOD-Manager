name: "Release"

on:
  push:
    tags:
      - "v*"               # 推送 v1.0.0 这样的标签时触发
  workflow_dispatch:       # 支持手动触发

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # 必须有写权限才能创建 Release
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.2.0"   # 与你本地版本一致

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.33.4"       # 与你本地版本一致

      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Create GitHub Release (draft)
        id: create-release
        uses: taiki-e/create-gh-release-action@v1
        with:
          title: ${{ github.ref_name }}
          draft: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ steps.create-release.outputs.id }}
          releaseBody: "请在此描述更新内容。"
          releaseDraft: true
          includeUpdaterJson: true   # 如果要用自动更新，保留此选项