<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WOTB MOD Manager - 加载中...</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
        color: #e0e0e0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        -webkit-app-region: drag;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 32px;
      }

      /* Spinner */
      .spinner {
        width: 56px;
        height: 56px;
        border: 4px solid rgba(255, 255, 255, 0.08);
        border-top-color: #5b8def;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Title */
      .title {
        font-size: 18px;
        font-weight: 600;
        color: #c0c8d8;
        letter-spacing: 0.5px;
      }

      /* Tasks */
      .tasks {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 360px;
      }

      .task-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.03);
        font-size: 14px;
        color: #8888a0;
        transition: color 0.3s, background 0.3s;
      }

      .task-item.running {
        color: #a0b8e0;
        background: rgba(91, 141, 239, 0.08);
      }

      .task-item.done {
        color: #7ecb8a;
        background: rgba(126, 203, 138, 0.06);
      }

      .task-item.error {
        color: #e0556a;
        background: rgba(224, 85, 106, 0.08);
      }

      .task-icon {
        flex-shrink: 0;
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .task-item.pending .task-icon::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
      }

      .task-item.running .task-icon::before {
        content: "";
        width: 16px;
        height: 16px;
        border: 2px solid rgba(91, 141, 239, 0.3);
        border-top-color: #5b8def;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
      }

      .task-item.done .task-icon::before {
        content: "\2713";
        font-size: 14px;
        color: #7ecb8a;
        font-weight: bold;
      }

      .task-item.error .task-icon::before {
        content: "\2717";
        font-size: 14px;
        color: #e0556a;
        font-weight: bold;
      }

      /* Footer */
      .footer {
        position: absolute;
        bottom: 24px;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.2);
        letter-spacing: 0.5px;
        -webkit-app-region: no-drag;
      }

      .footer .error-msg {
        color: #e0556a;
        font-size: 12px;
        margin-top: 8px;
        text-align: center;
        max-width: 360px;
        line-height: 1.5;
      }

      .progress-bar-container {
        width: 360px;
        height: 3px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 2px;
        overflow: hidden;
        margin-top: 4px;
      }

      .progress-bar-fill {
        height: 100%;
        background: #5b8def;
        border-radius: 2px;
        transition: width 0.4s ease;
        width: 0%;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="spinner" id="main-spinner"></div>
      <div class="title">正在加载 Mod 管理器，请稍候...</div>
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>
      <div class="tasks" id="tasks">
        <div class="task-item pending" data-step="1">
          <span class="task-icon"></span>
          <span>扫描 Mod 文件目录</span>
        </div>
        <div class="task-item pending" data-step="2">
          <span class="task-icon"></span>
          <span>读取已安装的 Mod 列表</span>
        </div>
        <div class="task-item pending" data-step="3">
          <span class="task-icon"></span>
          <span>检测 Mod 冲突</span>
        </div>
        <div class="task-item pending" data-step="4">
          <span class="task-icon"></span>
          <span>加载用户设置</span>
        </div>
      </div>
    </div>

    <div class="footer">
      <span id="version-text">v--</span>
      <div class="error-msg" id="error-msg"></div>
    </div>

    <script type="module" src="/src/splash.ts"></script>
  </body>
</html>
