[package]
name        = "tauri-app"
version     = "2.6.0"
description = "A Tauri App"
authors     = ["you"]
edition     = "2021"
repository  = "https://github.com/Uninen/tauri-vue-template"

[lib]
name         = "tauri_app_lib"
crate-type   = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri                        = { version = "2", features = [] }
tauri-plugin-shell           = "2"
tauri-plugin-prevent-default = "2.1"
tauri-plugin-dialog          = "2.3.2"
tauri-plugin-fs              = "2.4.1"

zip       = "0.6"
chrono    = "0.4"

serde     = { version = "1.0", features = ["derive"] }
serde_json= "1.0"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto           = true
opt-level     = "s"
panic         = "abort"
strip         = true
