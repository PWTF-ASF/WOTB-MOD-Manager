[package]
name        = "tauri-app"
version     = "2.6.0"
description = "A Tauri App"
authors     = ["you"]
edition     = "2021"
repository  = "https://github.com/Uninen/tauri-vue-template"

[lib]
name         = "tauri_app_lib"
crate-type   = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3", features = [] }

[dependencies]
tauri                        = { version = "2.3", features = ["protocol-asset"] }
tauri-plugin-shell           = "2.3"
tauri-plugin-prevent-default = "2.1"       # 无需改动
tauri-plugin-dialog          = "2.3"
tauri-plugin-fs              = "2.3"

# 其余依赖保持不变
zip = "2.0"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
base64 = "0.21"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto           = true
opt-level     = "s"
panic         = "abort"
strip         = true
